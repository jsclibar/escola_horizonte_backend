<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Biblioteca Saber</title>

  <!-- Carrega os estilos da página. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Biblioteca Saber</h1>
    <p>Clique no botão para consultar os livros.</p>

    <!-- O JavaScript encontra este botão pelo id "buscar". -->
    <button id="buscar" type="button">Buscar livros</button>

    <!-- O JavaScript coloca os livros dentro desta lista. -->
    <ul id="livros"></ul>
  </main>

  <!-- Carrega o código depois que os elementos HTML já existem. -->
  <script src="script.js"></script>
</body>
</html>
